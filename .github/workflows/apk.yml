name: Build APK

on:
  push:
    branches: ["**"]
    paths: ["www/**", "VERSION", "signing/**", "assets/**", "capacitor.config.json", "package.json", "android_patch/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài Capacitor
        run: |
          for i in 1 2 3 4; do npm install --no-audit --no-fund && exit 0; echo "thu lai $i"; rm -rf node_modules/sharp; sleep 45; done; exit 1

      - name: Tạo dự án Android
        run: npx cap add android

      - name: Toàn màn hình thật + vùng an toàn (V2.1.42, MainActivity)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          echo "$F"
          cp android_patch/MainActivity.java "$F"
          head -5 "$F"

      - name: Khóa màn hình dọc, ẩn thanh tiêu đề
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="portrait"/' "$M"
          grep -n "screenOrientation" "$M"

      - name: Khóa ký cố định + số phiên bản tăng dần
        run: |
          mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
          G=android/app/build.gradle
          V=$(head -1 VERSION)
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${V}.${GITHUB_RUN_NUMBER}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"
          cat >> "$G" <<'EOF'

          android {
              signingConfigs {
                  debug {
            storeFile file("../../signing/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
                  }
              }
          }
          EOF

      - name: Biểu tượng app + màn chờ
        run: npx capacitor-assets generate --android --iconBackgroundColor '#06101f' --splashBackgroundColor '#06101f' --splashBackgroundColorDark '#06101f'

      - name: Quyền rung
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q VIBRATE "$M" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' "$M"
          grep -n "permission" "$M"

      - name: Đồng bộ mã game
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          W=gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$W"; grep -q networkTimeout "$W" || echo networkTimeout=120000 >> "$W"
          sed -i '/^distributionSha256Sum=/d' "$W"; echo 'distributionSha256Sum=03ec176d388f2aa99defcadc3ac6adf8dd2bce5145a129659537c0874dea5ad1' >> "$W"
          # Gradle tự kiểm SHA-256 chính thức của gradle-8.2.1-bin.zip → nguồn dự phòng không thể thay tệp
          for U in 'https\://services.gradle.org/distributions/gradle-8.2.1-bin.zip' 'https\://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip' 'https\://services.gradle.org/distributions/gradle-8.2.1-bin.zip' 'https\://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip'; do
            sed -i "s#^distributionUrl=.*#distributionUrl=$U#" "$W"; grep distributionUrl "$W"
            ./gradlew assembleDebug --no-daemon && exit 0; echo "thu lai"; sleep 30
          done; exit 1

      - name: Đổi tên APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/PhiDoiSaoBang-$(head -1 VERSION).${GITHUB_RUN_NUMBER}.apk"
          keytool -printcert -jarfile out/*.apk | grep -q "Lemon1609" || { echo "APK KHÔNG ký bằng khóa cố định"; exit 1; }
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: PhiDoiSaoBang-apk
          path: out/*.apk
          retention-days: 1

      - name: Đăng lên Releases (tải thẳng APK trên điện thoại)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(head -1 VERSION).${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Phi Đội Sao Băng $TAG" --notes "Cài đè lên bản cũ, giữ nguyên dữ liệu chơi." --latest
