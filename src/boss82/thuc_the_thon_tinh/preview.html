<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thực Thể Thôn Tinh</title><style>*{box-sizing:border-box}body{margin:20px;background:#0b1220;color:#e8e4d9;font:14px/1.6 Arial}main{max-width:960px;margin:auto}h1{color:#b45cff;font-size:24px}button,select{min-height:44px;background:#101d30;color:#e8e4d9;border:1px solid #5ab8ff;padding:8px;margin:4px}canvas{display:block;max-width:100%;border:1px solid #34516b}.row{display:flex;flex-wrap:wrap;gap:12px}.row img{width:240px;height:240px;background:#101d30}a{color:#5ab8ff}label{display:inline-block;margin:8px}</style><main><h1>Thực Thể Thôn Tinh</h1><p>Mũi xuống · ảnh768×768 · đổi pha tại chỗ, cùng điểm neo. Đây là preview đồ họa, chưa ghép gameplay.</p><div id="buttons"></div><label><input id="marks" type="checkbox" checked> Điểm phát đạn</label><label><input id="anchors" type="checkbox" checked> Mốc thân</label><label>Lõi <select id="coreState"><option value="closed">Đóng</option><option value="open">Mở</option><option value="stunned">Choáng</option></select></label><canvas id="cv" width="786" height="800" style="width:393px;height:400px"></canvas><p id="status"></p><h2>Ba pha ở khung240px</h2><div class="row"><img src="phase1.png" alt="Pha1"><img src="phase2.png" alt="Pha2"><img src="phase3.png" alt="Pha3"></div><h2>Chân dung</h2><img src="portrait.png" width="96" height="96" alt="Chân dung"><p><a href="spec.md">Thông số</a> · <a href="registration.json">Registration</a> · <a href="emitters.json">Điểm phát đạn</a></p></main><script>
const data={"emitters": {"core_origin": [383.5, 357.5], "nose": [383.5, 633.5], "tentacle_left": [150, 495], "tentacle_right": [617, 495]}, "registration": [{"file": "phase1.png", "source_axis": 626.5, "source_hull_top": 1.0, "source_hull_bottom": 1109.0, "uniform_scale": 0.45126353790613716, "pivot": [383.5, 383.5], "hull_rear": [383.5, 133.5], "hull_prow": [383.5, 633.5], "bbox": [106, 133, 662, 670], "core_center": [383.5, 357.5]}, {"file": "phase2.png", "source_axis": 626.5, "source_hull_top": 1.0, "source_hull_bottom": 1111.0, "uniform_scale": 0.45045045045045046, "pivot": [383.5, 383.5], "hull_rear": [383.5, 133.5], "hull_prow": [383.5, 633.5], "bbox": [103, 133, 666, 684], "core_center": [383.5, 357.5]}, {"file": "phase3.png", "source_axis": 627.5, "source_hull_top": 0.0, "source_hull_bottom": 1217.0, "uniform_scale": 0.4108463434675431, "pivot": [383.5, 383.5], "hull_rear": [383.5, 133.5], "hull_prow": [383.5, 633.5], "bbox": [128, 134, 641, 636], "core_center": [383.5, 357.5]}, {"file": "core_closed.png", "role": "full_canvas_core_overlay", "pivot": [383.5, 383.5], "hull_rear": null, "hull_prow": null, "bbox": [332, 307, 436, 409], "uniform_scale": 1, "core_center": [383.5, 357.5]}, {"file": "core_open.png", "role": "full_canvas_core_overlay", "pivot": [383.5, 383.5], "hull_rear": null, "hull_prow": null, "bbox": [332, 306, 436, 410], "uniform_scale": 1, "core_center": [383.5, 357.5]}, {"file": "core_stunned.png", "role": "full_canvas_core_overlay", "pivot": [383.5, 383.5], "hull_rear": null, "hull_prow": null, "bbox": [332, 307, 436, 409], "uniform_scale": 1, "core_center": [383.5, 357.5]}]};let phase=1,images={};const cv=document.getElementById('cv'),ctx=cv.getContext('2d');ctx.scale(2,2);function draw(){ctx.fillStyle='#0b1220';ctx.fillRect(0,0,393,400);const w=320,k=w/768,ox=(393-w)/2,oy=32;ctx.drawImage(images['phase'+phase],ox,oy,w,w);if(images.core_closed){let s=document.getElementById('coreState').value;ctx.drawImage(images['core_'+s],ox,oy,w,w);}function dot(p,color,name){let x=ox+(p[0]+.5)*k,y=oy+(p[1]+.5)*k;ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.stroke();ctx.fillStyle=color;ctx.font='9px Arial';ctx.fillText(name,x+5,y-3);}if(document.getElementById('marks').checked)for(const [n,p]of Object.entries(data.emitters))dot(p,'#ffcf70',n);if(document.getElementById('anchors').checked){dot(data.registration[phase-1].pivot,'#5ab8ff','pivot');dot(data.registration[phase-1].hull_rear,'#3ee08f','rear');dot(data.registration[phase-1].hull_prow,'#3ee08f','prow');}document.getElementById('status').textContent='Pha '+phase+' · xem toàn khung320px; các ảnh đối chiếu phía dưới là240px.';}
for(let i=1;i<=3;i++){const b=document.createElement('button');b.textContent='Pha '+i;b.onclick=()=>{phase=i;draw()};document.getElementById('buttons').appendChild(b);}document.getElementById('marks').onchange=draw;document.getElementById('anchors').onchange=draw;const cs=document.getElementById('coreState');if(cs)cs.onchange=draw;
(async()=>{for(const n of ["phase1", "phase2", "phase3", "core_closed", "core_open", "core_stunned"]){await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[n]=im;resolve()};im.onerror=reject;im.src=n+'.png'});}draw();})().catch(()=>document.getElementById('status').textContent='Thiếu ảnh; hãy giải nén toàn bộ thư mục.');</script></html>
