<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trinh Sát Hạm U Ảnh</title><style>*{box-sizing:border-box}body{margin:20px;background:#0b1220;color:#e8e4d9;font:14px/1.6 Arial}main{max-width:960px;margin:auto}h1{color:#5ab8ff;font-size:24px}button,select{min-height:44px;background:#101d30;color:#e8e4d9;border:1px solid #5ab8ff;padding:8px;margin:4px}canvas{display:block;max-width:100%;border:1px solid #34516b}.row{display:flex;flex-wrap:wrap;gap:12px}.row img{width:240px;height:240px;background:#101d30}a{color:#5ab8ff}label{display:inline-block;margin:8px}</style><main><h1>Trinh Sát Hạm U Ảnh</h1><p>Mũi xuống · ảnh768×768 · đổi pha tại chỗ, cùng điểm neo. Đây là preview đồ họa, chưa ghép gameplay.</p><div id="buttons"></div><label><input id="marks" type="checkbox" checked> Điểm phát đạn</label><label><input id="anchors" type="checkbox" checked> Mốc thân</label><canvas id="cv" width="786" height="800" style="width:393px;height:400px"></canvas><p id="status"></p><h2>Ba pha ở khung240px</h2><div class="row"><img src="phase1.png" alt="Pha1"><img src="phase2.png" alt="Pha2"><img src="phase3.png" alt="Pha3"></div><h2>Chân dung</h2><img src="portrait.png" width="96" height="96" alt="Chân dung"><p><a href="spec.md">Thông số</a> · <a href="registration.json">Registration</a> · <a href="emitters.json">Điểm phát đạn</a></p></main><script>
const data={"emitters": {"nose": [383.5, 671], "wing_left": [204, 554], "wing_right": [563, 554], "fan_1": [331, 463], "fan_2": [354, 477], "fan_3": [383.5, 486], "fan_4": [413, 477], "fan_5": [436, 463], "laser_socket": [383.5, 543], "spiral_ring_origin": [383.5, 315], "drone_left": [241, 443], "drone_right": [526, 443]}, "registration": [{"file": "phase1.png", "source_axis": 626.5, "source_hull_top": 22.0, "source_hull_bottom": 1216.0, "uniform_scale": 0.4815745393634841, "pivot": [383.5, 383.5], "hull_rear": [383.5, 96.0], "hull_prow": [383.5, 671.0], "bbox": [145, 96, 624, 672]}, {"file": "phase2.png", "source_axis": 626.5, "source_hull_top": 22.0, "source_hull_bottom": 1216.0, "uniform_scale": 0.4815745393634841, "pivot": [383.5, 383.5], "hull_rear": [383.5, 96.0], "hull_prow": [383.5, 671.0], "bbox": [143, 96, 625, 672]}, {"file": "phase3.png", "source_axis": 626.5, "source_hull_top": 14.0, "source_hull_bottom": 1216.0, "uniform_scale": 0.478369384359401, "pivot": [383.5, 383.5], "hull_rear": [383.5, 96.0], "hull_prow": [383.5, 671.0], "bbox": [145, 96, 623, 672]}]};let phase=1,images={};const cv=document.getElementById('cv'),ctx=cv.getContext('2d');ctx.scale(2,2);function draw(){ctx.fillStyle='#0b1220';ctx.fillRect(0,0,393,400);const w=320,k=w/768,ox=(393-w)/2,oy=32;ctx.drawImage(images['phase'+phase],ox,oy,w,w);if(images.core_closed){let s=document.getElementById('coreState').value;ctx.drawImage(images['core_'+s],ox,oy,w,w);}function dot(p,color,name){let x=ox+(p[0]+.5)*k,y=oy+(p[1]+.5)*k;ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.stroke();ctx.fillStyle=color;ctx.font='9px Arial';ctx.fillText(name,x+5,y-3);}if(document.getElementById('marks').checked)for(const [n,p]of Object.entries(data.emitters))dot(p,'#ffcf70',n);if(document.getElementById('anchors').checked){dot(data.registration[phase-1].pivot,'#5ab8ff','pivot');dot(data.registration[phase-1].hull_rear,'#3ee08f','rear');dot(data.registration[phase-1].hull_prow,'#3ee08f','prow');}document.getElementById('status').textContent='Pha '+phase+' · xem toàn khung320px; các ảnh đối chiếu phía dưới là240px.';}
for(let i=1;i<=3;i++){const b=document.createElement('button');b.textContent='Pha '+i;b.onclick=()=>{phase=i;draw()};document.getElementById('buttons').appendChild(b);}document.getElementById('marks').onchange=draw;document.getElementById('anchors').onchange=draw;const cs=document.getElementById('coreState');if(cs)cs.onchange=draw;
(async()=>{for(const n of ["phase1", "phase2", "phase3"]){await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[n]=im;resolve()};im.onerror=reject;im.src=n+'.png'});}draw();})().catch(()=>document.getElementById('status').textContent='Thiếu ảnh; hãy giải nén toàn bộ thư mục.');</script></html>
